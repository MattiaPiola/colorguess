<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColorGuess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>ColorGuess</h1>
      <p>Train your color intuition with guessing and harmony modes.</p>

      <section class="panel settings-panel">
        <div class="settings-grid">
          <label>
            Mode
            <select id="mode">
              <option value="guess">Color Guess</option>
              <option value="harmony">Color Harmony</option>
            </select>
          </label>

          <label>
            Color model
            <select id="model">
              <option value="rgb">RGB</option>
              <option value="cmyk">CMYK</option>
              <option value="hsl">HSL</option>
            </select>
          </label>

          <label class="checkbox-label">
            <input id="infiniteRounds" type="checkbox" checked />
            Infinite rounds
          </label>

          <label>
            Rounds
            <input id="rounds" type="number" value="10" min="1" max="100" />
          </label>

          <label id="visibilityLabel" class="checkbox-label">
            <input id="alwaysVisible" type="checkbox" checked />
            Target always visible
          </label>

          <label id="hideSecondsLabel">
            Hide after (s)
            <input id="hideSeconds" type="number" value="3" min="1" max="15" />
          </label>

          <label id="harmonyTypeLabel" class="hidden">
            Harmony type
            <select id="harmonyType">
              <option value="analogous">Analogous</option>
              <option value="complementary">Complementary</option>
              <option value="split-complementary">Split complementary</option>
              <option value="triad">Triad</option>
              <option value="bad-harmony">Bad harmony</option>
            </select>
          </label>
        </div>
      </section>

      <section class="panel game-panel">
        <div class="status-row">
          <strong id="roundStatus">Round 1</strong>
          <button id="nextRound" type="button">New target</button>
        </div>

        <div class="swatches-row">
          <div class="target-wrap" id="targetWrap">
            <div class="target-swatch" id="targetSwatch"></div>
            <span class="swatch-label">Target</span>
          </div>
          <div class="guess-preview" id="guessPreview">
            <span class="swatch-label">Your guess</span>
          </div>
        </div>

        <div id="harmonyTargets" class="harmony-targets"></div>

        <form id="guessForm" class="guess-form">
          <div id="inputs"></div>
          <button type="submit">Submit guess</button>
        </form>

        <div class="feedback" id="feedback">Pick values and submit to get feedback.</div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
